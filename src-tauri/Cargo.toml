[package]
name = "bastides"
version = "0.2.0"
description = "Jeu de stratégie médiéval procédural"
authors = ["Antoine Marchal"]
edition = "2021"

[lib]
name = "bastides_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake", "connect"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
